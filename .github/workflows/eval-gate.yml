name: eval-gate
# The product gates itself: every push and PR, no path filter —
# the gate's own tests changing MUST trigger the gate.
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IE-06b diffs the registry against the base ref
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: IE-06 registry schema lint (hard block)
        run: python evals/runners/registry_lint.py
      - name: IE-06b registry diff-justification lint (hard block)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no base ref available (initial push) — skipping diff lint"
            exit 0
          fi
          python evals/runners/registry_diff_lint.py --base "$BASE"
      - name: eval-theater self-audit (hard block — the auditor's home repo stays clean)
        run: python evals/runners/theater_audit.py .
      - name: candidate/v2 conformance — own fixtures agree with own contract
        run: python evals/runners/candidate_conformance.py evals/fixtures/block/healthy.json --registry evals/metrics/registry.yaml
      - name: L0 unit + property + gate-logic + conductor tests (hard block)
        run: python -m pytest tests/ -q
      - name: Candidate suite run (demo pipeline)
        run: python evals/runners/run_suite.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Gate (baseline vs candidate)
        run: python evals/runners/promote.py
      - name: Conductor audit (the 27-step ledger gates this repo)
        run: python conductor/conductor.py audit
